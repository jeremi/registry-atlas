[package]
name = "semantic-asset-discovery-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
semantic-asset-discovery-core = { path = "../semantic-asset-discovery-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
