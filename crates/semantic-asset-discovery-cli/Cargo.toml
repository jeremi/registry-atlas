[package]
name = "semantic-asset-discovery-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "semantic-asset-discovery"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
semantic-asset-discovery = { path = "../semantic-asset-discovery" }
semantic-asset-discovery-core = { path = "../semantic-asset-discovery-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "net"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tiny_http = "0.12"
