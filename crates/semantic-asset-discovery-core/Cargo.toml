[package]
name = "semantic-asset-discovery-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
regex = "1"
rio_api = "0.8"
rio_turtle = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
url = "2"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
